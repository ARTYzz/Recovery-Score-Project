name: boxer_recovery
description: Mobile recovery support for boxers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.7.0
  shared_preferences: ^2.5.0
  sqflite_sqlcipher: ^3.4.1
  path_provider: ^2.1.5
  file_picker: ^13.3.3
  image_picker: ^1.1.0
  cupertino_icons: ^1.0.8
  health: 13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
